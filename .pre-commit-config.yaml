repos:
  # ── Python toolchain: ruff, mypy, bandit ────────────────────────────────────
  # Run via `uv run` so the versions come from uv.lock — the same ones CI and a
  # manual `uv run ruff check .` use. Pinning them a second time with pre-commit
  # `rev:` drifts in both directions: these previously held ruff 0.4.10 and mypy
  # 1.10 against 0.15/2.1 in the lock, so the hooks blocked commits CI accepted
  # *and* passed code CI would reject. uv.lock is now the only version pin.
  # `--no-sync` keeps hooks fast and avoids mutating the venv mid-commit.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]

      # Whole-tree rather than per-file: mypy needs the full import graph, and
      # tests/ is included deliberately — CI checked src/ only, so type errors
      # in tests reached main unnoticed.
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src/ tests/
        language: system
        pass_filenames: false
        files: ^(src|tests)/

      # B602 (shell=True) enforced; B404/B603/B607 skipped in pyproject.
      - id: bandit
        name: bandit
        entry: uv run --no-sync bandit -c pyproject.toml -r src/
        language: system
        pass_filenames: false
        files: ^src/

  # ── shellcheck: lint shell scripts ──────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ── check-toml: validate TOML syntax ────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ── pytest: unit tests (pre-commit stage) ───────────────────────────────────
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Exit 5 = "no tests collected" — treat as success during skeleton phase.
        entry: bash -c 'uv run --no-sync pytest; rc=$?; [ $rc -eq 5 ] && exit 0 || exit $rc'
        language: system
        pass_filenames: false
        files: ^(src|tests)/

  # ── pip-audit: dependency vulnerability scan (pre-push only) ─────────────────
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
