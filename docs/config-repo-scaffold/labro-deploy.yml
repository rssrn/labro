# .github/workflows/labro-deploy.yml (in the config repo)
# Triggers on labro.toml or docker-compose.yml changes. Copies both to the
# host and performs a graceful restart (drains in-flight runs before
# restarting the container).
#
# Required repo secrets:
#   TAILSCALE_AUTHKEY — ephemeral auth key from Tailscale admin (Actions → Keys)
#   DEPLOY_HOST       — user@hostname (Tailscale hostname), e.g. ubuntu@my-server
#
# SSH auth is handled by Tailscale SSH ACLs (tag:github-runner); no SSH key needed.
on:
  push:
    paths:
      - 'labro.toml'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-tags=tag:github-runner

      - name: Copy updated config
        run: |
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            labro.toml ${{ secrets.DEPLOY_HOST }}:/opt/labro/data/labro.toml
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            docker-compose.yml ${{ secrets.DEPLOY_HOST }}:/opt/labro/docker-compose.yml

      - name: Graceful restart
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.DEPLOY_HOST }} '
            cd /opt/labro
            docker compose exec -T labro touch /data/LABRO_DISABLED < /dev/null
            while [ "$(docker compose exec -T labro sqlite3 /data/labro.db \
                "SELECT COUNT(*) FROM project_locks" < /dev/null 2>/dev/null)" != "0" ]; do
              echo "waiting..."; sleep 5
            done
            docker compose up -d --force-recreate
            docker compose exec -T labro rm -f /data/LABRO_DISABLED < /dev/null
          '
