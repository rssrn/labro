# .github/workflows/labro-update.yml (in the config repo)
# Pulls the latest labro image and replaces the running container.
# Run manually via Actions → Run workflow after pushing a new labro release tag.
#
# Required repo secrets:
#   TAILSCALE_AUTHKEY — ephemeral auth key from Tailscale admin (Actions → Keys)
#   DEPLOY_HOST       — user@hostname (Tailscale hostname), e.g. ubuntu@my-server
#
# Requires /opt/labro/docker-compose.yml to already be present on the host
# (synced by labro-deploy.yml). Labro secrets are read from /opt/labro/.env
# on the host (written by this workflow from GitHub repo secrets — add
# GH_APP_PRIVATE_KEY_BASE64, CLAUDE_CODE_OAUTH_TOKEN, OPENROUTER_API_KEY,
# CODEX_API_KEY, CODEX_AUTH_JSON_BASE64 as needed).
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-tags=tag:github-runner

      - name: Pull latest image and replace container
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -euo pipefail
            cd /opt/labro

            echo "Pulling latest image..."
            docker compose pull labro

            if [ "$(docker inspect -f '{{.State.Running}}' labro 2>/dev/null || echo 'false')" = "true" ]; then
              echo "Draining in-flight runs..."
              docker compose exec -T labro touch /data/LABRO_DISABLED < /dev/null 2>/dev/null || true
              while [ "$(docker compose exec -T labro sqlite3 /data/labro.db \
                  'SELECT COUNT(*) FROM project_locks' < /dev/null 2>/dev/null)" != "0" ]; do
                echo "waiting..."; sleep 5
              done
            fi

            # If labro is still the old plain `docker run` container (no compose
            # labels), compose can't adopt it — remove it once so `up` can take over.
            if docker inspect labro >/dev/null 2>&1 && \
               [ -z "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' labro 2>/dev/null)" ]; then
              echo "Removing non-compose-managed labro container..."
              docker stop labro 2>/dev/null || true
              docker rm labro 2>/dev/null || true
            fi

            echo "Replacing container..."
            docker compose up -d --force-recreate
            rm -f /opt/labro/data/LABRO_DISABLED

            echo "Done. labro is running $(docker inspect -f '{{.Config.Image}}' labro)"
          ENDSSH
